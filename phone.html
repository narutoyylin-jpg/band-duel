button id="chatSend" type="submit"></button></div><div class="chat-meta"><span id="chatHint"></span><span id="chatCounter"></span></div></form></dialog><button id="greetingOpen" class="greeting-open" type="button" hidden aria-label="發送戰鬥問候">···</button><div id="greetingBubble" class="greeting-bubble" hidden role="status" aria-live="polite"></div><dialog id="greetingPanel" class="dialog greeting-dialog" aria-labelledby="greetingTitle"><header class="tutorial-head"><h2 id="greetingTitle"></h2><button id="greetingClose"></button></header><div id="greetingOptions" class="greeting-grid"></div><label class="greeting-mute"><input id="greetingMute" type="checkbox"><span id="greetingMuteLabel"></span></label><button id="friendMessagesOpen" type="button" hidden></button><p id="greetingHint" class="social-note" style="padding:0 18px 12px"></p></dialog><dialog id="teamMatchEntry" class="dialog team-entry" aria-labelledby="teamMatchTitle"><header class="tutorial-head"><h2 id="teamMatchTitle"></h2><button id="teamMatchClose" type="button"></button></header><div class="tutorial-body"><p id="teamMatchIntro" class="team-entry-text"></p><div id="matchAbilityRules" class="ability-rules"><small data-ability-label></small><div><button type="button" data-ability-mode="classic" aria-pressed="true"></button><button type="button" data-ability-mode="skills" aria-pressed="false"></button></div></div><p id="teamMatchRoundsLabel" class="team-note"></p><div id="teamMatchRounds" class="team-rounds"></div><div class="team-match-actions"><button id="teamMatchSolo" type="button"></button><button id="teamMatchParty" type="button"></button></div><p id="teamMatchHint" class="team-note"></p><p id="teamMatchStatus" role="status" class="social-error"></p></div></dialog><dialog id="teamEntry" class="dialog team-entry" aria-labelledby="teamEntryTitle"><header class="tutorial-head"><h2 id="teamEntryTitle"></h2><button id="teamEntryClose" type="button"></button></header><div class="tutorial-body"><p id="teamEntryText" class="team-entry-text"></p><div class="ability-rules"><small data-ability-label></small><div><button type="button" data-ability-mode="classic" aria-pressed="true"></button><button type="button" data-ability-mode="skills" aria-pressed="false"></button></div></div><button id="teamPractice" class="wide" type="button"></button><p id="teamPracticeNote" class="team-note"></p><button id="teamCreate" class="wide" type="button"></button><form id="teamJoinForm" class="team-join-form"><label id="teamJoinLabel" for="teamJoinCode"></label><div><input id="teamJoinCode" class="code-input" maxlength="6" autocomplete="off" spellcheck="false" required><button id="teamJoin" type="submit"></button></div></form><p id="teamEntryNote" class="team-note"></p><p id="teamEntryStatus" class="social-error" role="status"></p></div></dialog><script>/* PHONE BEGIN */
const DUEL_TARGETS=[
  {id:'I-A',type:'Type I',eSide:'A',hSide:'A'},
  {id:'I-B',type:'Type I',eSide:'B',hSide:'B'},
  {id:'II-AB',type:'Type II',eSide:'A',hSide:'B'},
  {id:'II-BA',type:'Type II',eSide:'B',hSide:'A'}
];
const DUEL_TYPE_TARGETS=[
  {id:'I-any',type:'Type I',eSide:null,hSide:null},
  {id:'II-any',type:'Type II',eSide:null,hSide:null}
];
const DUEL_BOUNDARY_TARGET={id:'boundary-any',type:'邊界排列',eSide:null,hSide:null};
const DUEL_TERMINAL_TARGETS=[...DUEL_TYPE_TARGETS,DUEL_BOUNDARY_TARGET];
const DUEL_LENGTHS={5:12,12:30};
const DUEL_THINK_MS=30000;
const SHUFFLE_BOUNDARY_CHANCE=.10;
const duelRoundLimit=g=>DUEL_LENGTHS[g?.roundLimit]?g.roundLimit:5;
const duelStartingPoints=g=>DUEL_LENGTHS[duelRoundLimit(g)];
function setDuelLength(g,rounds){
  if(!Number.isInteger(rounds)||!Object.hasOwn(DUEL_LENGTHS,rounds))throw Error('請選擇 5 或 12 回合。');
  if(g.round!==1||g.history.length)throw Error('對局開始後不能更改回合數。');
  return {...g,roundLimit:rounds,playerBudget:DUEL_LENGTHS[rounds],cpuBudget:DUEL_LENGTHS[rounds]};
}
const isTypeOnlyGoal=q=>q.eSide===null&&q.hSide===null;
function typeOnlyGoal(q){
  const goal=DUEL_TERMINAL_TARGETS.find(x=>x.type===q.type);
  if(!goal)throw Error('任務無效。');return {...goal};
}
function shuffleGoals(random=Math.random){
  const first=Math.min(3,Math.max(0,Math.floor(random()*4))),rest=DUEL_TARGETS.filter((_,i)=>i!==first);
  return {player:{...DUEL_TARGETS[first]},cpu:{...rest[Math.min(2,Math.max(0,Math.floor(random()*3)))]}};
}
const DUEL_MODES={types:'Type I vs Type II',together:'Type I',separate:'Type II',shuffle:'Shuffle'};
function goalsForMode(mode='shuffle',random=Math.random){
  if(!Object.hasOwn(DUEL_MODES,mode))throw Error('對戰模式無效。');
  if(mode==='shuffle')return shuffleGoals(random);
  if(mode==='types'){
    const first=random()<.5?0:1;
    return {player:{...DUEL_TYPE_TARGETS[first]},cpu:{...DUEL_TYPE_TARGETS[1-first]}};
  }
  const start=mode==='together'?0:2,swap=random()<.5;
  return {player:{...DUEL_TARGETS[start+(swap?1:0)]},cpu:{...DUEL_TARGETS[start+(swap?0:1)]}};
}
const otherBand=field=>field==='ec'?'ev':'ec';
const DUEL_CHARACTERS=[
  {id:'charge',name:'蓄能',en:'Recharge',icon:'⚡',skill:'蓄能',skillEn:'Recharge',description:'本回合不移動，回復 2 點，最多回到初始點數。每場一次，第二回合起可用。',descriptionEn:'Skip movement to restore 2 points, up to the starting budget. Once per match, from round 2.'},
  {id:'split',name:'分流',en:'Split',icon:'⇄',skill:'分流',skillEn:'Split',description:'本職能帶與另一條能帶各移動一格，方向可分別選擇，花費 3 點。每場一次，第二回合起可用。',descriptionEn:'Move your primary band and the other band one step each. Choose both directions. Costs 3 points. Once per match, from round 2.'},
  {id:'pulse',name:'脈衝',en:'Pulse',icon:'◈',skill:'脈衝',skillEn:'Pulse',description:'本職能帶移動兩格，只花 1 點。每場一次，第二回合起可用。',descriptionEn:'Move your primary band two steps for 1 point. Once per match, from round 2.'},
  {id:'jam',name:'精準干擾',en:'Precision',icon:'◎',skill:'精準干擾',skillEn:'Precision',description:'另一條能帶移動一格，只花 1 點。每場一次，第二回合起可用。',descriptionEn:'Move the other band one step for 1 point. Once per match, from round 2.'}
];
function draftDuelSkills(g,actors,mode='classic',random=Math.random){
 if(!['classic','skills'].includes(mode))throw Error('技能模式無效。');g.abilityMode=mode;g.characters={};g.skillUsed={};g.skillOffers={};
 for(const actor of actors){g.characters[actor]=null;g.skillUsed[actor]=false;const deck=DUEL_CHARACTERS.map(c=>c.id);for(let i=deck.length-1;i>0;i--){const j=Math.min(i,Math.floor(random()*(i+1)));[deck[i],deck[j]]=[deck[j],deck[i]];}g.skillOffers[actor]=mode==='skills'?deck.slice(0,3):[];}return g;
}
function selectDuelSkill(g,actor,id){
 if(g.abilityMode==='classic'||!g.abilityMode&&!g.characters){if(id)throw Error('經典與牌位模式不使用技能。');return;}
 if(!g.abilityMode)id??=g.characters?.[actor]||'charge';
 if(!validDuelCharacter(id)||g.skillOffers&&!g.skillOffers[actor]?.includes(id))throw Error('請從本場抽到的三種技能中選一個。');g.characters??={};g.characters[actor]=id;
}
const validDuelCharacter=id=>DUEL_CHARACTERS.some(c=>c.id===id);
function duelSkillView(g,actor='player'){
  const other=actor==='player'?'cpu':'player';return {enabled:g.abilityMode==='skills'||!g.abilityMode&&!!g.characters,offers:g.skillOffers?.[actor]||[],yours:g.characters?.[actor]||null,opponent:g.characters?.[other]||null,yourUsed:!!g.skillUsed?.[actor],opponentUsed:!!g.skillUsed?.[other]};
}
function duelActionDeltas(a){return {[a.field]:a.delta,...(a.secondaryField?{[a.secondaryField]:a.secondaryDelta}:{})};}
function applyDuelAction(board,a){for(const [field,delta] of Object.entries(duelActionDeltas(a)))board[field]+=delta;return board;}
function resolvedDuelResources(g,p,c){
  const cap=duelStartingPoints(g);return {playerBudget:Math.min(cap,g.playerBudget-p.cost+(p.refund||0)),cpuBudget:Math.min(cap,g.cpuBudget-c.cost+(c.refund||0)),...(g.characters?{skillUsed:{player:!!g.skillUsed?.player||!!p.skill,cpu:!!g.skillUsed?.cpu||!!c.skill}}:{})};
}
const bandName=field=>field==='ec'?'導帶':'價帶';
function makeDuel(controlled='ec',goals=shuffleGoals()){
  if(!['ec','ev'].includes(controlled))throw Error('請選擇有效的能帶。');
  for(const actor of ['player','cpu'])if(![...DUEL_TARGETS,...DUEL_TYPE_TARGETS].some(q=>q.id===goals?.[actor]?.id&&q.type===goals[actor].type&&q.eSide===goals[actor].eSide&&q.hSide===goals[actor].hSide))throw Error('任務無效。');
  if(goals.player.id===goals.cpu.id)throw Error('雙方需要不同的收集目標。');
  return {started:false,active:false,countFirstRound:true,controlled,mission:'shuffle',goals:structuredClone(goals),round:1,roundLimit:5,stage:'setup',board:{ec:0,ev:0},playerBudget:12,cpuBudget:12,playerScore:0,cpuScore:0,history:[],cpuPlan:null,plan:{kind:'own',direction:controlled==='ec'?-1:1,amount:3},tip:false};
}
function carrierModel(ec,ev){
  const thermal=8.617333262e-5*300,electronB=1/(1+Math.exp(ec/thermal)),holeB=1/(1+Math.exp(-ev/thermal));
  const eSide=ec===0?'equal':ec<0?'B':'A',hSide=ev===0?'equal':ev>0?'B':'A';
  return {electronB,holeB,eSide,hSide,type:eSide==='equal'&&hSide==='equal'?'零位差':eSide==='equal'||hSide==='equal'?'邊界排列':eSide===hSide?'Type I':'Type II'};
}
function goalFor(q,board){
  const r=carrierModel(board.ec*.02,board.ev*.02),any=isTypeOnlyGoal(q),eShare=any?Math.max(r.electronB,1-r.electronB):q.eSide==='B'?r.electronB:1-r.electronB,hShare=any?Math.max(r.holeB,1-r.holeB):q.hSide==='B'?r.holeB:1-r.holeB,quality=Math.min(eShare,hShare),aligned=r.type===q.type&&(any||r.eSide===q.eSide&&r.hSide===q.hSide);
  return {...q,eShare,hShare,quality,typeMatches:r.type===q.type,aligned,strong:aligned&&quality>=.9,points:aligned?(quality>=.9?2:1):0};
}
// A type-only task can change collection direction to fit the public opposite band.
function goalDirection(q,field,board,fallback=1){
  if(q.type==='邊界排列')return board[field]===0?fallback:-Math.sign(board[field]);
  if(!isTypeOnlyGoal(q))return field==='ec'?(q.eSide==='B'?-1:1):(q.hSide==='B'?1:-1);
  const opposite=board[otherBand(field)];
  return opposite===0?fallback:Math.sign(opposite)*(q.type==='Type I'?-1:1);
}
function duelGoal(g,actor,board=g.board){return goalFor(g.goals[actor],board);}
function duelOutcome(g,board=g.board){
  const player=duelGoal(g,'player',board),cpu=duelGoal(g,'cpu',board),sameType=player.type===cpu.type;
  let playerGain=player.points,cpuGain=cpu.points,reason='type';
  if(sameType){playerGain=cpuGain=0;if(!player.typeMatches)reason='unmatched';else if(Math.abs(player.quality-cpu.quality)<1e-9)reason='tie';else{reason='ratio';if(player.quality>cpu.quality)playerGain=player.quality>=.9?2:1;else cpuGain=cpu.quality>=.9?2:1;}}
  return {player,cpu,sameType,playerGain,cpuGain,reason};
}
function normalizeDuelAction(a){
  if(!a||typeof a!=='object'||Array.isArray(a)||Object.keys(a).some(k=>!['kind','direction','amount','skill','splitDirection'].includes(k))||!['own','attack','hold'].includes(a.kind)||![1,-1].includes(a.direction)||!Number.isInteger(a.amount)||a.amount<0||a.amount>4||(a.kind!=='hold'&&a.amount===0))throw Error('動作、方向或幅度無效。');
  if(a.skill!==undefined){

  const core=value.trim(),pair=translationPairs.get(core);
  if(pair)return value.replace(core,tx(...pair));

function localizeDOM(root=document){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
  while((node=walker.nextNode())){
    if(node.parentElement?.closest('script,style,[data-no-translate]'))continue;
    let record=localizedNodes.get(node);if(!record||node.nodeValue!==record.last)record={source:node.nodeValue};
    record.last=translated(record.source);if(node.nodeValue!==record.last)node.nodeValue=record.last;localizedNodes.set(node,record);
  }
  root.querySelectorAll('[aria-label],[aria-valuetext],[title],[alt],[placeholder],meta[name=description]').forEach(el=>{
    const records=localizedAttributes.get(el)||{};
    for(const attr of ['aria-label','aria-valuetext','title','alt','placeholder',...(el.matches('meta')?['content']:[])])if(el.hasAttribute(attr)){
      const current=el.getAttribute(attr);let r=records[attr];if(!r||current!==r.last)r={source:current};r.last=translated(r.source);el.setAttribute(attr,r.last);records[attr]=r;
    }localizedAttributes.set(el,records);
  });
  document.documentElement.lang=siteLanguage==='en'?'en':'zh-Hant';
  const toggle=document.getElementById('languageToggle');if(toggle){toggle.innerHTML=siteLanguage==='en'?'<b>EN</b> / CN':'EN / <b>CN</b>';toggle.setAttribute('aria-label',tx('切換為英文','Switch to Chinese'));}
}
function setSiteLanguage(lang){if(!['cn','en'].includes(lang))throw Error('Invalid language');siteLanguage=lang;try{localStorage.setItem('band-language',lang);const u=new URL(location.href);if(u.searchParams.has('lang')){u.searchParams.set('lang',lang);history.replaceState(null,'',u);}}catch{}localizeDOM();document.dispatchEvent(new CustomEvent('band-language'));return lang;}
function initializeLanguage(){document.getElementById('languageToggle')?.addEventListener('click',()=>setSiteLanguage(siteLanguage==='en'?'cn':'en'));localizeDOM();}

const socialState={roomPicker:false,data:null,busy:false,error:'',notice:'',timer:null,loading:false};
const greetingState={seen:new Set(),session:null,lastSent:0,sending:false,muted:false,timer:null,cpuTimer:null};
async function socialApi(path='',body){
 const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),12000);
 try{const r=await fetch('/api/friends'+(path?'/'+path:''),{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:abort.signal});const data=await r.json();if(!r.ok){const e=Error(data.error||tx('好友無法同步。','Friends could not sync.'));e.status=r.status;throw e;}return data;}finally{clearTimeout(timer);}
}
function renderSocialEntry(){const n=(socialState.data?.incoming.length||0)+(socialState.data?.invites.filter(i=>i.expiresAt>Date.now()).length||0)+chatUnreadCount();$('friendsOpen').textContent=tx('好友','Friends')+(n?' · '+n:'');$('friendsOpen').classList.toggle('has-notice',!!n);renderChatNotice();}
function socialRows(entries,kind){
 return entries.map(e=>{
  const p=e.profile,code=htmlText(e.code),button=(op,label,cls='quiet')=>'<button type="button" class="'+cls+'" data-social-op="'+op+'" data-player-code="'+code+'" '+(socialState.busy?'disabled':'')+'>'+label+'</button>';
  let buttons=kind==='friends'?button('chat',tx('聊天','Chat')+((socialState.data?.unread?.[e.code]||0)?' · '+socialState.data.unread[e.code]:''),'invite')+button('invite',tx('邀請對戰','Invite'),'invite')+button('remove',tx('移除','Remove'))+button('block',tx('封鎖','Block')):kind==='incoming'?button('accept',tx('接受','Accept'),'invite')+button('remove',tx('略過','Decline'))+button('block',tx('封鎖','Block')):kind==='outgoing'?button('remove',tx('取消邀請','Cancel')):kind==='blocked'?button('unblock',tx('解除封鎖','Unblock')):'<button type="button" class="invite" data-join-invite="'+htmlText(e.id)+'" '+(socialState.busy?'disabled':'')+'>'+tx('加入','Join')+'</button><button type="button" class="quiet" data-dismiss-invite="'+htmlText(e.id)+'" '+(socialState.busy?'disabled':'')+'>'+tx('略過','Decline')+'</button>';
  if(socialState.roomPicker&&kind==='friends')buttons=button('invite',tx('邀請加入','Invite to room'),'invite');
  return '<div class="friend-row">'+avatarMarkup(p,'small')+'<div class="friend-row-copy"><strong>'+htmlText(p?.displayName||tx('玩家','Player'))+'</strong><small>'+htmlText(kind==='invites'?tx('邀你進房間 ','Invites you to room ')+e.roomCode:code+' · '+(p?.rating??1000)+tx(' 積分',' pts'))+'</small></div><div class="friend-row-actions">'+buttons+'</div></div>';
 }).join('');
}

async function refreshFriends(quiet=false){
 if(socialState.loading)return;socialState.loading=true;if(!quiet)socialState.error='';
 try{socialState.data=await socialApi();}catch(e){if(e.status===401)socialState.data=null;else if(!quiet)socialState.error=e.name==='AbortError'?tx('連線逾時，請再試一次。','Connection timed out. Please retry.'):e.message;}finally{socialState.loading=false;renderSocialEntry();if($('friends').open)renderFriends();}
}
async function openFriends(){if(!$('friends').open)$('friends').showModal();renderFriends();await refreshFriends();}
async function socialCommand(operation,body){
 if(socialState.busy)return;socialState.busy=true;socialState.error='';socialState.notice='';renderFriends();
 try{socialState.data=await socialApi(operation,body);socialState.notice=operation==='request'?tx('已送出好友邀請。','Friend request sent.'):operation==='accept'?tx('你們已成為好友！','You are now friends!'):operation==='invite'?tx('已送出房間邀請，2 分鐘內有效。','Room invitation sent. Valid for 2 minutes.'):tx('已更新。','Updated.');return true;}catch(e){socialState.error=e.message;return false;}finally{socialState.busy=false;renderFriends();}
}
const socialCanJoin=()=>!ui.busy&&!ui.queue&&(!ui.data||['finished','closed'].includes(ui.data.stage));
async function inviteFriend(code){
 if(socialState.busy)return;
 if(ui.queue||ui.busy||ui.data&&!(['lobby','party'].includes(ui.data.stage)&&(ui.kind==='online'&&ui.data.matchKind==='friend'||ui.kind==='team'&&ui.data.host))&&!['finished','closed'].includes(ui.data.stage)){socialState.error=tx('請先完成目前對局或取消配對，再邀請好友。','Finish your match or cancel matching before inviting a friend.');renderFriends();return;}
 if(ui.data&&['finished','closed'].includes(ui.data.stage))await leave();
 if(!ui.data){if(teamMatchUi.format==='2v2')await connectTeam('create');else await connect('create');}
 if(!['online','team'].includes(ui.kind)||!['lobby','party'].includes(ui.data?.stage)||!['friend','team'].includes(ui.data.matchKind)){socialState.error=ui.error||tx('房間尚未就緒。','The room is not ready.');renderFriends();return;}

}
async function joinFriendInvite(id){
 if(socialState.busy)return;if(!socialCanJoin()){socialState.error=tx('請先完成目前對局或取消配對，再加入好友。','Finish your match or cancel matching before joining a friend.');renderFriends();return;}
 await refreshFriends(true);const invite=socialState.data?.invites.find(i=>i.id===id&&i.expiresAt>Date.now());if(!invite){socialState.error=tx('邀請已失效，請好友重新邀請。','This invitation expired. Ask for a new one.');renderFriends();return;}
 if(ui.data)await leave();if(invite.kind==='team')await connectTeam('join',invite.roomCode);else await connect('join',invite.roomCode);
 if(ui.credentials?.code===invite.roomCode){closeAnimatedDialog($('friends'));await socialCommand('dismiss-invite',{id});}else{socialState.error=ui.error;renderFriends();}
}
function scheduleFriends(){clearTimeout(socialState.timer);if(document.hidden)return;socialState.timer=setTimeout(async()=>{if(!document.hidden&&(shopState.data?.signedIn||$('friends').open))await refreshFriends(true);scheduleFriends();},$('friends').open?8000:20000);}
function greetingText(id){const p=BATTLE_GREETINGS.find(x=>x.id===id);return p?tx(p.zh,p.en):'';}
function showGreeting(m){
 if(m.sender==='opponent'&&greetingState.muted)return;clearTimeout(greetingState.timer);const box=$('greetingBubble');box.dataset.sender=m.sender;box.innerHTML='<small>'+htmlText(m.sender==='you'?tx('你','You'):ui.data?.opponentProfile?.displayName||tx('對手','Opponent'))+'</small><strong>'+htmlText(greetingText(m.phrase))+'</strong>';box.hidden=false;greetingState.timer=setTimeout(()=>box.hidden=true,3400);
}
function syncGreetings(d){
 const enabled=!!d&&(d.joined||shopState.data?.signedIn)&&['lobby','role','mode','plan','revealed','finished'].includes(d.stage);$('greetingOpen').hidden=!enabled;$('greetingOpen').setAttribute('aria-label',tx('發送戰鬥問候','Send a battle greeting'));
 const session=d?(ui.kind==='cpu'?'CPU:'+ui.cpuCoinId:d.code):null;
 if(greetingState.session!==session){greetingState.session=session;greetingState.seen.clear();greetingState.lastSent=0;clearTimeout(greetingState.timer);clearTimeout(greetingState.cpuTimer);$('greetingBubble').hidden=true;}
 if(!enabled){if($('greetingPanel').open)$('greetingPanel').close();return;}
 for(const m of d.greetings||[])if(!greetingState.seen.has(m.sender+':'+m.id)){greetingState.seen.add(m.sender+':'+m.id);if(m.sender==='you')greetingState.lastSent=Math.max(greetingState.lastSent,m.at);if(Date.now()-m.at<6500)showGreeting(m);}
}
function renderGreetingPanel(){
 $('greetingTitle').textContent=tx('打個招呼','Say hello');$('greetingClose').textContent=tx('關閉','Close');$('greetingMuteLabel').textContent=tx('隱藏對手的問候','Hide opponent greetings');$('greetingMute').checked=greetingState.muted;
 const waiting=Date.now()-greetingState.lastSent<GREETING_COOLDOWN||!ui.data?.joined;renderChatNotice();
 $('greetingOptions').innerHTML=BATTLE_GREETINGS.map(p=>'<button type="button" data-greeting="'+p.id+'" '+(waiting||greetingState.sending?'disabled':'')+'>'+htmlText(tx(p.zh,p.en))+'</button>').join('');$('greetingHint').textContent=waiting?tx('稍等一下，下一句馬上就能送出。','Please wait a moment before sending another.'):tx('每 4 秒可送一句，對方也能隱藏問候。','Send one every 4 seconds. Players can hide greetings.');
}
async function sendGreeting(phrase){
 if(!ui.data?.joined||greetingState.sending||Date.now()-greetingState.lastSent<GREETING_COOLDOWN)return;const session=greetingState.session;greetingState.sending=true;renderGreetingPanel();
 try{
  if(ui.kind==='online'){const view=await api('/'+ui.credentials.code+'/greeting',{phrase,requestId:crypto.randomUUID()});if(greetingState.session===session)receive(view);}
  else{greetingState.lastSent=Date.now();showGreeting({phrase,sender:'you'});const reply=phrase==='hello'?'hello':phrase==='good-luck'?'good-luck':phrase==='again'?'well-played':'thanks';greetingState.cpuTimer=setTimeout(()=>{if(greetingState.session===session)showGreeting({phrase:reply,sender:'opponent'});},1900);}
  closeAnimatedDialog($('greetingPanel'));
 }catch(e){$('greetingHint').textContent=translated(e.message);}finally{greetingState.sending=false;}
}

 document.addEventListener('band-language',()=>{renderSocialEntry();if($('friends').open)renderFriends();if($('greetingPanel').open)renderGreetingPanel();});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(socialState.timer);else{if(shopState.data?.signedIn)refreshFriends(true);scheduleFriends();}});window.addEventListener('pagehide',()=>{clearTimeout(socialState.timer);clearTimeout(greetingState.timer);clearTimeout(greetingState.cpuTimer);});window.addEventListener('pageshow',scheduleFriends);renderSocialEntry();scheduleFriends();

const chatState={code:null,profile:null,messages:[],before:null,olderLoaded:false,generation:0,loading:null,sending:false,allowed:true,error:'',timer:null,lastRead:0,renderKey:'',drafts:new Map(),intents:new Map()};
function chatUnreadCount(){return Object.values(socialState.data?.unread||{}).reduce((sum,n)=>sum+n,0);}
function renderChatNotice(){
 const n=chatUnreadCount();$('friendMessagesOpen').textContent=tx('好友聊天','Friend messages')+(n?' · '+Math.min(99,n)+(n>99?'+':''):'');$('friendMessagesOpen').hidden=!shopState.data?.signedIn;

function chatClock(at){return new Intl.DateTimeFormat(siteLanguage==='en'?'en':'zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(at));}
function updateChatViewport(){if(!$('friendChat').open)return;const v=window.visualViewport,h=v?.height||window.innerHeight,desired=Math.min(740,h-32);$('friendChat').style.setProperty('--chat-viewport-height',h+'px');$('friendChat').style.setProperty('--chat-top',((v?.offsetTop||0)+Math.max(12,(h-desired)/2))+'px');}
function renderFriendChat(force=false){
 updateChatViewport();
 $('chatTitle').textContent=chatState.profile?.displayName||tx('好友聊天','Friend messages');$('chatPeerCode').textContent=chatState.code||'';$('chatPeerAvatar').innerHTML=avatarMarkup(chatState.profile,'small');$('chatBack').textContent=tx('‹ 好友','‹ Friends');$('chatClose').textContent=tx('關閉','Close');$('chatOlder').textContent=tx('載入更早訊息','Load older messages');$('chatOlder').hidden=!chatState.before;$('chatOlder').disabled=chatState.loading===chatState.generation;
 $('chatInput').placeholder=tx('輸入訊息…','Write a message…');$('chatInput').setAttribute('aria-label',tx('訊息內容','Message text'));$('chatSend').textContent=chatState.sending?tx('傳送中…','Sending…'):tx('傳送','Send');$('chatInput').disabled=!chatState.allowed;
 const length=Array.from($('chatInput').value.trim()).length;$('chatCounter').textContent=length+' / 400';$('chatCounter').classList.toggle('over-limit',length>400);$('chatSend').disabled=chatState.sending||!chatState.allowed||length===0||length>400;
 $('chatStatus').textContent=translated(chatState.error)||(chatState.loading===chatState.generation&&!chatState.messages.length?tx('載入訊息中…','Loading messages…'):'');$('chatHint').textContent=tx('Enter 傳送 · Shift+Enter 換行 · 僅限互相確認的好友','Enter to send · Shift+Enter for a new line · Accepted friends only');
 const key=siteLanguage+':'+chatState.messages.map(m=>m.id).join(',');if(!force&&key===chatState.renderKey)return;chatState.renderKey=key;
 const stream=$('chatScroll'),bottom=stream.scrollHeight-stream.clientHeight-stream.scrollTop<80,first=chatState.messages.length&&!$('chatMessages').children.length,list=$('chatMessages');list.replaceChildren();
 if(!chatState.messages.length){const empty=document.createElement('p');empty.className='chat-empty';empty.textContent=chatState.allowed?tx('打個招呼，開始你們的第一段對話。','Say hello to start your conversation.'):tx('目前無法讀取這段對話。','This conversation is currently unavailable.');list.append(empty);}
 for(const m of chatState.messages){const row=document.createElement('article'),bubble=document.createElement('p'),time=document.createElement('time');row.className='chat-message '+(m.sender==='you'?'mine':'theirs');row.dataset.messageId=String(m.id);bubble.textContent=m.text;time.dateTime=new Date(m.createdAt).toISOString();time.textContent=chatClock(m.createdAt);row.append(bubble,time);list.append(row);}
 if(bottom||first)stream.scrollTop=stream.scrollHeight;
}
function scheduleChat(){clearTimeout(chatState.timer);if(!$('friendChat').open||document.hidden||!chatState.allowed)return;chatState.timer=setTimeout(()=>loadFriendChat(),2500);}
async function markChatRead(generation){
 if(document.hidden||!$('friendChat').open||generation!==chatState.generation)return;const last=chatState.messages.at(-1)?.id||0;if(last<=chatState.lastRead)return;
 try{await socialApi('chat',{operation:'read',code:chatState.code,lastId:last});if(generation!==chatState.generation)return;chatState.lastRead=last;if(socialState.data?.unread)socialState.data.unread[chatState.code]=0;renderSocialEntry();}catch{}
}
async function loadFriendChat(older=false){
 const generation=chatState.generation,code=chatState.code;if(!code||chatState.loading===generation||older&&!chatState.before)return;chatState.loading=generation;renderFriendChat();const oldHeight=$('chatScroll').scrollHeight,oldTop=$('chatScroll').scrollTop;
 try{
  const data=await socialApi('chat?code='+encodeURIComponent(code)+(older?'&before='+chatState.before:''));if(generation!==chatState.generation)return;chatState.profile=data.profile;chatState.allowed=true;chatState.error='';const merged=new Map(chatState.messages.map(m=>[m.id,m]));for(const m of data.messages)merged.set(m.id,m);chatState.messages=[...merged.values()].sort((a,b)=>a.id-b.id);
  if(older||!chatState.olderLoaded)chatState.before=data.beforeCursor;if(older)chatState.olderLoaded=true;renderFriendChat();if(older)$('chatScroll').scrollTop=oldTop+$('chatScroll').scrollHeight-oldHeight;await markChatRead(generation);
 }catch(e){if(generation!==chatState.generation)return;chatState.error=['AbortError','TypeError'].includes(e.name)?tx('連線逾時，訊息仍保留，請重試。','Connection timed out. Your draft is safe; retry.'):e.message;if([401,403,404].includes(e.status)){chatState.allowed=false;chatState.messages=[];}}

}
async function openFriendChat(code){
 const friend=socialState.data?.friends.find(f=>f.code===code);if(!friend)return;clearTimeout(chatState.timer);chatState.generation++;Object.assign(chatState,{code,profile:friend.profile,messages:[],before:null,olderLoaded:false,lastRead:0,renderKey:'',allowed:true,error:'',sending:false,loading:null});$('chatInput').value=chatState.drafts.get(code)||'';
 if($('friends').open)$('friends').close();if($('greetingPanel').open)$('greetingPanel').close();if(!$('friendChat').open)$('friendChat').showModal();renderFriendChat(true);await loadFriendChat();

async function sendFriendMessage(){
 if(chatState.sending||!chatState.allowed)return;const code=chatState.code,text=$('chatInput').value.trim(),generation=chatState.generation;if(!text||Array.from(text).length>400)return;

 for(const kind of ['kick','snare','hat'])if(score[kind].includes(pos))musicDrum(track,when,kind);

}

  try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!duelSound.context){duelSound.context=new Audio();duelSound.effectsGain=duelSound.context.createGain();duelSound.effectsGain.connect(duelSound.context.destination);applyAudioGains();}if(duelSound.context.state==='suspended')duelSound.context.resume().then(syncMusic).catch(()=>{});else syncMusic();}catch{}
}
function soundNote(frequency,duration=.09,delay=0,volume=.035,type='sine',endFrequency=null){
  const c=duelSound.context;if(!duelSound.enabled||!duelSound.effectsVolume||!c||c.state!=='running')return;
  const o=c.createOscillator(),g=c.createGain(),start=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(frequency,start);if(endFrequency)o.frequency.exponentialRampToValueAtTime(endFrequency,start+duration);
  g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.008);g.gain.exponentialRampToValueAtTime(.0001,start+duration);
  o.connect(g);g.connect(duelSound.effectsGain);duelSound.voices.add(o);o.onended=()=>{duelSound.voices.delete(o);o.disconnect();g.disconnect();};o.start(start);o.stop(start+duration+.025);return o;
}
function soundEffect(name){
  if(!duelSound.enabled||duelSound.context?.state!=='running')return;
  duelSound.played[name]=(duelSound.played[name]||0)+1;
  if(name==='tap'){soundNote(680,.065,0,.019,'sine',440);}
  else if(name==='role'){soundNote(440,.16,0,.035);soundNote(660,.22,.065,.025);}
  else if(name==='coin'){
    for(let i=0;i<12;i++){const delay=i*.065+i*i*.003;soundNote(1450+(i%3)*240,.045,delay,.019*(1-i/17),'triangle',1000);}
    soundNote(720,.23,1.24,.033,'triangle');
  }else if(name==='move'){soundNote(210,.24,0,.013,'sine',420);soundNote(630,.18,.08,.009,'sine');}
  else if(name==='lock'){soundNote(170,.12,0,.042,'triangle',75);soundNote(980,.055,.07,.024,'triangle');soundNote(540,.09,.13,.018);}
  else if(name==='reveal'){soundNote(380,.15,0,.022);soundNote(570,.22,.08,.02);}
  else if(name==='win'){[523,659,784,1047].forEach((n,i)=>soundNote(n,.48,i*.12,.036,'triangle'));}
  else if(name==='loss'){[440,349,262].forEach((n,i)=>soundNote(n,.36,i*.16,.026,'triangle'));}
  else if(name==='draw'){[440,554,660].forEach(n=>soundNote(n,.5,0,.023));}
  else if(name==='countdown'){soundNote(880,.11,0,.04,'sine',740);}
  else if(name==='countdown-final'){soundNote(1175,.16,0,.05,'triangle');soundNote(1175,.11,.19,.035,'sine');}
}

function musicTone(track,midi,time,duration,volume,type='sine',cutoff=2000){

  o.connect(filter);filter.connect(g);g.connect(track.bus);g.connect(track.delay);track.voices.add(o);o.onended=()=>{track.voices.delete(o);o.disconnect();g.disconnect();filter.disconnect();};o.start(time);o.stop(time+duration+.03);

  const c=duelSound.context;if(kind==='kick'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(105,time);o.frequency.exponentialRampToValueAtTime(42,time+.14);g.gain.setValueAtTime(.10,time);g.gain.exponentialRampToValueAtTime(.0001,time+.22);o.connect(g);g.connect(track.bus);track.voices.add(o);o.onended=()=>{track.voices.delete(o);o.disconnect();g.disconnect();};o.start(time);o.stop(time+.24);return;}

}
function scheduleMusicStep(track,step,time){
  if(scheduleScoreStep(track,step,time))return;
  const duel=track.id==='band-clash',root=(duel?[38,41,34,36]:[50,46,53,48])[Math.floor(step/16)%4],beat=60/(duel?108:78),eighth=beat/2;
  if(step%8===0){const chord=duel?[12,15,19]:[0,7,10,15];for(const note of chord)musicTone(track,root+note,time,beat*4.6,duel?.017:.023,'triangle',duel?1200:850);}
  if(duel){
    if(step%2===0)musicTone(track,root+(step%8===6?7:0),time,eighth*1.55,.057,'triangle',500);
    if(step%8===0||step%8===4)musicDrum(track,time,'kick');if(step%8===2||step%8===6)musicDrum(track,time,'snare');musicDrum(track,time,'hat');
    if(step%2===1){const melody=[24,27,31,29,24,22,27,31][Math.floor(step/2)%8];musicTone(track,root+melody,time,beat*.82,.019,'sine',2300);}
  }else{
    const melody=[12,19,22,15,19,24,22,19][step%8];musicTone(track,root+melody,time,beat*1.8,.027,'sine',2400);
    if(step%8===0)musicTone(track,root-12,time,beat*3.9,.037,'sine',400);

function stopMusicTrack(track,fade=true){

async function rankingApi(body){const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),12000);try{const response=await fetch('/api/leaderboard',{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:abort.signal});let data;try{data=await response.json();}catch{throw Error(tx('排行榜暫時無法連線，請稍後再試。','Leaderboard unavailable. Please try again.'));}if(!response.ok)throw Error(translated(data.error));return data;}catch(e){if(e instanceof TypeError)throw Error(tx('排行榜暫時無法連線，請稍後再試。','Leaderboard unavailable. Please try again.'));throw e;}finally{clearTimeout(timer);}}

function tutorialExample(topic,variant=tutorialMotion.case){
 if(['team','matching'].includes(topic))return {boards:Array.from({length:tutorialLesson(topic).labels.length},()=>({ec:1,ev:-1}))};
 if(topic==='skills')return {boards:[{ec:1,ev:1},{ec:1,ev:1},{ec:1,ev:1},{ec:2,ev:2}]};
 if(topic==='scoring'&&variant==='boundary'){
  const g=makeTerminalDuel('ec',{player:DUEL_BOUNDARY_TARGET,cpu:DUEL_TYPE_TARGETS[0]});Object.assign(g,{active:true,started:true,stage:'plan',round:5,board:{ec:2,ev:2}});
  const result=resolveTerminalDuel(g,{kind:'own',direction:-1,amount:2},{kind:'hold',direction:1,amount:0}),last=result.history.at(-1);
  return {boards:[last.startBoard,last.afterFirstBoard,last.board,last.board],game:g,result,decision:last.decision,goal:g.goals.player,opponentGoal:g.goals.cpu};
 }
 if(topic==='bands')return {boards:[{ec:0,ev:0},{ec:-3,ev:0},{ec:-3,ev:3},{ec:-4,ev:4}]};
 if(topic==='types')return {boards:[{ec:-3,ev:3},{ec:-3,ev:-3},{ec:0,ev:-3}]};
 if(topic==='controls')return {boards:[{ec:1,ev:1},{ec:-1,ev:1},{ec:-1,ev:1},{ec:-1,ev:1}]};
 if(topic==='points')return {boards:[{ec:1,ev:1},{ec:-1,ev:1},{ec:-1,ev:-1},{ec:-1,ev:-1}]};
 const sameII=variant.startsWith('ii-'),v=variant.replace(/^ii-/,''),type=sameII?'Type II':'Type I';
 const goals={player:{type,eSide:null,hSide:null},cpu:{type:v==='different'?'Type II':type,eSide:null,hSide:null}};
 const compare=['ratio','tie','creation'].includes(v),g=makeTerminalDuel('ec',goals);Object.assign(g,{active:true,started:true,stage:'plan',round:5,firstActor:'player',board:compare?{ec:-2,ev:sameII?-2:2}:{ec:1,ev:sameII?-1:1}});
 const hold={kind:'hold',direction:1,amount:0},own={kind:'own',direction:-1,amount:compare?1:2};
 const opponent=v==='ratio'||v==='creation'?hold:v==='tie'?{kind:'own',direction:sameII?-1:1,amount:1}:{kind:'own',direction:sameII?1:-1,amount:2};
 const result=resolveTerminalDuel(g,own,opponent),last=result.history.at(-1);
 return {boards:[last.startBoard,last.afterFirstBoard,last.board,last.board],game:g,result,decision:last.decision,goal:goals.player,opponentGoal:goals.cpu};
}

function paintTutorialBoard(board,from=null,to=null,progress=1){const graph=$('tutorialGraph');if(!graph)return;graph.innerHTML=bandSVG(board,{controlled:['bands','types'].includes(tutorialTab)?null:'ec',can:false,previous:from,movement:tutorialMotion.step===1?'you':'opponent',tween:from?{from,to,progress}:null});

async function playTutorialDemo(single=null){
 stopTutorialDemo();if(!$('tutorial').open)return;const token=tutorialMotion.generation,e=tutorialMotion.example;tutorialMotion.playing=true;
 const count=tutorialLesson(tutorialTab).labels.length,steps=single===null?Array.from({length:count},(_,i)=>i):[single],fast=['reveal','scoring'].includes(tutorialTab),extended=['team','skills','matching'].includes(tutorialTab);
 for(const step of steps){if(token!==tutorialMotion.generation)return;tutorialMotion.step=step;const from=e.boards[Math.min(e.boards.length-1,Math.max(0,step-1))],to=e.boards[Math.min(step,e.boards.length-1)];renderTutorialStage(from);
  if(['team','matching'].includes(tutorialTab)){tutorialMotion.task=tweenBands(from,to,(_,p)=>paintTutorialSpecial(p),reducedMotion()?1:tutorialTab==='team'&&step===4?4200:1800);}
  else if(tutorialTab==='controls'&&step===2){const lock=document.querySelector('[data-demo-lock]');tutorialMotion.task=tweenBands(from,to,(_,p)=>lock?.style.setProperty('--demo-fill',p),reducedMotion()?1:1600);}
  else if(step>0&&!(tutorialTab==='controls'&&step===3)){tutorialMotion.task=tweenBands(from,to,(b,p)=>paintTutorialBoard(b,from,to,p),reducedMotion()?1:fast?1300:1700);}
  else tutorialMotion.task=tweenBands(to,to,()=>{},reducedMotion()?1:fast?850:1100);
  if(!await tutorialMotion.task.promise)return;tutorialMotion.task=tweenBands(to,to,()=>{},single===null?(fast?1100:extended?2400:1600):1);if(!await tutorialMotion.task.promise)return;
 }
 if(token!==tutorialMotion.generation)return;tutorialMotion.playing=false;tutorialMotion.task=null;renderTutorialStage();
}

 nav.scrollLeft=previousScroll;const selected=nav.querySelector('[aria-selected="true"]');if(selected){const bounds=nav.getBoundingClientRect(),button=selected.getBoundingClientRect();if(button.left<bounds.left)nav.scrollLeft-=bounds.left-button.left;else if(button.right>bounds.right)nav.scrollLeft+=button.right-bounds.right;}

}

 $('tutorialContent').closest('.tutorial-body').scrollTop=0;renderTutorialStage();localizeDOM();if(!preserve)playTutorialDemo();

$('codeInput').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(e.target.value.length===6){joinRoomFromCode();}});
$('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();joinRoomFromCode();}});
$('versusContinue').addEventListener('click',e=>tapAction(e.currentTarget,acknowledgeVersus));
document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;ui.roleChoicePending=b.dataset.role;$('roleAvatar').classList.add('to-'+b.dataset.role);tapAction(b,()=>command('role',{controlled:b.dataset.role,...(ui.data.skills?.enabled?{character:ui.character}:{})}),true).finally(()=>{ui.roleChoicePending=null;render();});}));
document.querySelectorAll('[data-rounds]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;ui.selectedRounds=Number(b.dataset.rounds);renderModeChoices(ui.data);}));

$('playGraph').addEventListener('click',e=>{const t=e.target.closest('[data-graph-band]');if(t)chooseBand(t.dataset.graphBand);});
$('playGraph').addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){const t=e.target.closest('[data-graph-band]');if(t){e.preventDefault();chooseBand(t.dataset.graphBand);}}});
$('offset').addEventListener('input',e=>slider(e.target.value));$('minus').addEventListener('click',()=>slider(Number($('offset').value)-1));$('plus').addEventListener('click',()=>slider(Number($('offset').value)+1));$('hold').addEventListener('click',toggleHold);
let holdTimer=null,heldPointer=null,holdFrame=null;
function cancelHold(){if(holdTimer)clearTimeout(holdTimer);cancelAnimationFrame(holdFrame);holdTimer=null;holdFrame=null;heldPointer=null;$('lock').classList.remove('holding');$('lock').style.setProperty('--hold-progress','0');stopChargeSound();}
$('lock').addEventListener('pointerdown',e=>{if(e.button!==0||!editable()||$('lock').disabled)return;e.preventDefault();cancelHold();unlockSound();startChargeSound();heldPointer=e.pointerId;$('lock').setPointerCapture(e.pointerId);$('lock').classList.add('holding');const started=performance.now(),tick=now=>{$('lock').style.setProperty('--hold-progress',String(Math.min(1,(now-started)/650)));if(heldPointer!==null)holdFrame=requestAnimationFrame(tick);};holdFrame=requestAnimationFrame(tick);holdTimer=setTimeout(()=>{holdTimer=null;cancelAnimationFrame(holdFrame);holdFrame=null;heldPointer=null;$('lock').style.setProperty('--hold-progress','1');stopChargeSound();command('lock');},650);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])$('lock').addEventListener(event,cancelHold);
$('lock').addEventListener('pointermove',e=>{if(heldPointer!==e.pointerId)return;const b=$('lock').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)cancelHold();});
$('lock').addEventListener('click',e=>{if(e.detail===0&&editable())command('lock');});$('lock').addEventListener('contextmenu',e=>e.preventDefault());

for(const [id,link] of [['copyCode',false],['copyInvite',true]])$(id).addEventListener('click',async()=>{try{await navigator.clipboard.writeText(link?location.origin+'/play?room='+ui.data.code:ui.data.code);$(id).textContent='已複製';}catch{ui.error='請手動輸入房號 '+ui.data.code;render();}});
$('tutorialOpen').addEventListener('click',e=>tapAction(e.currentTarget,()=>openTutorial()));$('tutorialClose').addEventListener('click',()=>closeAnimatedDialog($('tutorial')));document.querySelectorAll('[data-tutorial]').forEach(b=>b.addEventListener('click',()=>{tutorialTab=b.dataset.tutorial;renderTutorial();if(!reducedMotion())$('tutorialContent').animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:220});}));
$('resultType').addEventListener('click',e=>tapAction(e.currentTarget,()=>{if(['revealed','finished'].includes(ui.data?.stage))$('resultInfo').showModal();}));$('resultInfoClose').addEventListener('click',()=>closeAnimatedDialog($('resultInfo')));
$('verdictConfirm').addEventListener('click',acknowledgeVerdict);

for(const id of ['roomClose','roomCloseResult','teamClose'])$(id).addEventListener('click',e=>tapAction(e.currentTarget,requestRoomClose));
for(const id of ['roomRematchSettings','teamRematchSettings'])$(id).addEventListener('click',e=>{const button=e.target.closest('[data-rematch-setting]');if(button&&!button.disabled)tapAction(button,()=>changeRematchSetting(button.dataset.rematchSetting,button.dataset.rematchValue));});
for(const id of ['tutorial','resultInfo','leaderboard','audioSettings'])$(id).addEventListener('cancel',e=>{e.preventDefault();closeAnimatedDialog($(id));});
$('verdict').addEventListener('cancel',e=>{e.preventDefault();acknowledgeVerdict();});
document.querySelector('.topbar>.home-link').addEventListener('click',e=>{if(!ui.data&&!ui.credentials)return;e.preventDefault();e.stopImmediatePropagation();tapAction(e.currentTarget,leave);});
document.querySelectorAll('a[href]').forEach(a=>a.addEventListener('click',e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||e.button!==0||a.target||a.hasAttribute('download')||reducedMotion())return;e.preventDefault();if(motion.navigating)return;motion.navigating=true;document.body.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'});setTimeout(()=>location.href=a.href,160);}));
document.querySelectorAll('[data-replay-step]').forEach(b=>b.addEventListener('click',()=>selectReplay(Number(b.dataset.replayStep))));
$('replayToggle').addEventListener('click',()=>{if(ui.replayPlaying){stopReplay(true);renderGame(ui.data);}else playReplay();});
$('tutorial').addEventListener('close',()=>{stopTutorialDemo();updateCoverMotion();});for(const id of ['leaderboard','resultInfo'])$(id).addEventListener('close',updateCoverMotion);
document.addEventListener('band-language',()=>{render();if($('tutorial').open)renderTutorial(true);if($('verdict').open)updateVerdict();if($('leaderboard').open)renderLeaderboard();if($('shop').open)renderShop();if($('roomCreate').open)renderRoomCreate();renderSeasons();if($('audioSettings').open)renderAudioSettings();if($('avatarEditor').open)renderPhotoEditor();});initializeLanguage();
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelHold();quietSound();pauseMusic();stopCoverMotion();stopWaitingAnimation(false);}else{refresh();schedulePoll();updateCoverMotion();syncMusic();syncWaitingAnimation();}});window.addEventListener('pagehide',()=>{cancelHold();quietSound();pauseMusic();stopCoverMotion();stopDraftMotion();stopPoll();stopReplay();stopTutorialDemo();stopWaitingAnimation(false);});window.addEventListener('pageshow',()=>{motion.navigating=false;document.body.getAnimations().forEach(a=>a.cancel());refresh();schedulePoll();updateCoverMotion();syncMusic();syncWaitingAnimation();});

    {name:'practice_phone_duel',description:'Start a duel against the computer. Choose five or twelve rounds after selecting a band.',inputSchema:empty,execute:practice},
    {name:'select_phone_role',description:'Tap a half of the screen to choose conduction or valence. The other player confirms the remaining role.',inputSchema:{type:'object',properties:{controlled:{type:'string',enum:['ec','ev']}},required:['controlled'],additionalProperties:false},execute:x=>command('role',{controlled:x.controlled})},

    {name:'plan_phone_action',description:'Privately plan a legal action during your turn. First round own up to four steps, later up to two steps.',inputSchema:actions,execute:planAction},
    {name:'lock_phone_action',description:'Confirm the action, equivalent to holding Lock in. The screen stays locked until both players finish and reveal together.',inputSchema:empty,execute:()=>command('lock')},
    {name:'prepare_phone_round',description:'Prepare after a revealed round. Both players must be ready. The same band goes first each round.',inputSchema:empty,execute:()=>command('ready')},

  ])try{Promise.resolve(context.registerTool(tool)).catch(()=>{});}catch{}
