<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Band Duel · Offline</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#000;color:#dce8fa;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{max-width:330px;text-align:center}img{width:128px;border-radius:28px}h1{font-size:23px;margin:20px 0 14px}p{font-size:14px;line-height:1.8;color:#9aabc6}a{display:inline-block;margin-top:20px;background:#182a47;border:1px solid #577cac;color:#d7e7ff;padding:12px 28px;border-radius:12px;text-decoration:none}</style></head><body><main><img src="/app-icon-192.png" alt="Band Duel"><h1 id="title">目前沒有網路連線</h1><p id="message">恢復網路後，再回來進行對戰。你的帳號資料仍保存在遊戲伺服器。</p><a id="retry" href="/play">重新連線</a></main><script>if((localStorage.getItem('band-language')||navigator.language).startsWith('en')){document.documentElement.lang='en';document.getElementById('title').textContent='You are offline';document.getElementById('message').textContent='Reconnect to return to the duel. Your account is still saved on the game server.';document.getElementById('retry').textContent='Reconnect';}</script></body></html>
